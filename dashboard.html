<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#01696f">
  <link rel="manifest" href="./manifest.json">
  <title>Finviz Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,sans-serif;
      margin:0;
      padding:14px;
      background:#eef2f5;
      color:#17202a;
    }
    h1{
      font-size:1.35rem;
      margin:4px 0 10px;
    }
    .top{
      position:sticky;
      top:0;
      z-index:2;
      background:#eef2f5;
      padding-bottom:10px;
    }
    .controls{
      display:flex;
      gap:8px;
    }
    .controls select{
      flex:1;
      min-width:0;
      padding:10px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      background:#fff;
      color:#17202a;
      font-size:.95rem;
    }
    .search-wrap{
      position:relative;
      margin-bottom:8px;
    }
    .search-wrap input{
      width:100%;
      padding:10px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      background:#fff;
      color:#17202a;
      font-size:.95rem;
    }
    .search-results{
      position:absolute;
      top:calc(100% + 4px);
      left:0;
      right:0;
      background:#fff;
      border:1px solid #cbd5e1;
      border-radius:9px;
      box-shadow:0 4px 12px #17202a22;
      max-height:280px;
      overflow-y:auto;
      z-index:5;
    }
    .search-item{
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding:9px 12px;
      cursor:pointer;
      border-bottom:1px solid #eef2f5;
    }
    .search-item:last-child{
      border-bottom:none;
    }
    .search-item:hover{
      background:#f5f7fa;
    }
    .search-item .t{
      font-weight:700;
      color:#075985;
    }
    .search-item .c{
      color:#64748b;
      font-size:.82rem;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .meta{
      color:#64748b;
      font-size:.78rem;
      margin:8px 0;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
      gap:12px;
    }
    .card{
      border-radius:14px;
      padding:14px;
      box-shadow:0 2px 8px #17202a18;
      cursor:pointer;
    }
    .card-highlight{
      animation:cardFlash 1.6s ease-out;
    }
    @keyframes cardFlash{
      0%{ box-shadow:0 0 0 5px #2563eb99, 0 2px 8px #17202a18; }
      100%{ box-shadow:0 2px 8px #17202a18; }
    }
    .bull{background:#e8f5e9}
    .bear{background:#ffebee}
    .mixed{background:#fff8d6}
    .head{
      display:flex;
      align-items:center;
      gap:9px;
      border-bottom:1px solid #ffffff99;
      padding-bottom:10px;
      margin-bottom:10px;
    }
    .logo{
      width:32px;
      height:32px;
      border-radius:8px;
      object-fit:contain;
      background:#fff;
    }
    .ticker{
      font-size:1.2rem;
      font-weight:750;
      color:#075985;
      text-decoration:none;
    }
    .company{
      font-size:.92rem;
      margin-top:3px;
    }
    .star{
      margin-left:auto;
      align-self:flex-start;
      background:none;
      border:none;
      font-size:1.4rem;
      line-height:1;
      cursor:pointer;
      color:#cbd5e1;
      padding:2px 4px;
    }
    .star.active{
      color:#f5b301;
    }
    .previews{
      display:flex;
      gap:8px;
      margin:10px 0 4px;
    }
    .mini{
      flex:1;
      background:#ffffff66;
      border-radius:8px;
      padding:4px 4px 2px;
      min-width:0;
    }
    .mini svg{
      width:100%;
      height:44px;
      display:block;
    }
    .mini-label{
      display:block;
      text-align:center;
      font-size:.65rem;
      color:#64748b;
      margin-top:2px;
    }
    .fields{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .label{
      display:block;
      color:#64748b;
      font-size:.72rem;
    }
    .value{
      display:block;
      font-size:.9rem;
      font-weight:600;
      overflow-wrap:anywhere;
    }
    .positive{color:#16803c}
    .negative{color:#b42318}
    .empty{
      padding:20px;
      background:#fff;
      border-radius:12px;
      color:#64748b;
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Finviz Dashboard</h1>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Cerca un titolo (azioni, ETF, valute, commodity)..." autocomplete="off">
      <div id="searchResults" class="search-results" style="display:none"></div>
    </div>
    <div class="controls">
      <select id="assetType">
        <option value="azioni">Azioni</option>
        <option value="etf">ETF</option>
        <option value="valute">Valute</option>
        <option value="commodity">Commodity</option>
      </select>
      <select id="sort">
        <option value="market_cap">Ordina: Market Cap</option>
        <option value="change">Ordina: Change</option>
        <option value="ticker">Ordina: Ticker</option>
        <option value="trend_6m">Ordina: Trend 6M</option>
        <option value="price">Ordina: Prezzo</option>
        <option value="last_earnings_date" selected>Ordina: Last earnings date</option>
        <option value="watchlist">La mia lista</option>
      </select>
    </div>
    <div id="meta" class="meta">Caricamento...</div>
  </div>

  <main id="grid" class="grid"></main>

  <script>
    let data = [], history = {}, sortKey = localStorage.getItem("sortKey") || "last_earnings_date", direction = -1;
    let assetClass = localStorage.getItem("assetClass") || "azioni";

    // Watchlist salvata in localStorage (solo elenco di ticker)
    let watchlist = new Set(JSON.parse(localStorage.getItem("watchlist") || "[]"));

    function saveWatchlist(){
      localStorage.setItem("watchlist", JSON.stringify(Array.from(watchlist)));
    }

    function inWatchlist(ticker){
      return watchlist.has(ticker);
    }

    function toggleWatchlist(ticker){
      if (watchlist.has(ticker)) {
        watchlist.delete(ticker);
      } else {
        watchlist.add(ticker);
      }
      saveWatchlist();
      draw();
    }

    const grid = document.querySelector("#grid");
    const meta = document.querySelector("#meta");

    const num = v => {
      let m = String(v || "").replace("%","").match(/(-?[\d.]+)([BMKT])?/i);
      return m
        ? parseFloat(m[1]) * ({T:1e12,B:1e9,M:1e6,K:1e3}[String(m[2] || "").toUpperCase()] || 1)
        : 0;
    };

    const dateNum = v => {
      let m = String(v || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : 0;
    };

    const esc = v => String(v ?? "").replace(/[&<>"']/g, x => (
      {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[x]
    ));

    function passesTrendFilter(r){
      const trend = String(r.trend_6m || "").toUpperCase();
      const sma = String(r.sma_status || "").toUpperCase();
      return (
        (trend === "HIGH" && sma.startsWith("SOPRA")) ||
        (trend === "LOW" && sma.startsWith("SOTTO"))
      );
    }

    function cardClass(r){
      let h = String(r.trend_6m).toUpperCase() === "HIGH";
      let l = String(r.trend_6m).toUpperCase() === "LOW";
      let a = String(r.sma_status).toUpperCase().startsWith("SOPRA");
      let b = String(r.sma_status).toUpperCase().startsWith("SOTTO");
      return h && a ? "bull" : l && b ? "bear" : "mixed";
    }

    function miniChart(closes, label){
      if (closes.length < 2) return "";
      let mn = Math.min(...closes), mx = Math.max(...closes), w = 145, h = 44;
      let pts = closes.map((x,i) => `${(i/(closes.length-1))*w},${h-4-((x-mn)/(mx-mn || 1))*(h-8)}`).join(" ");
      let color = closes[closes.length-1] >= closes[0] ? "#16803c" : "#b42318";
      return `<div class="mini">
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
        </svg>
        <span class="mini-label">${label}</span>
      </div>`;
    }

    function previews(t){
      let all = history[t] || [];
      if (all.length < 2) return "";
      let sixM = all.slice(-126).map(x => x.close);
      let twoY = all.slice(-504).map(x => x.close);
      return `<div class="previews">${miniChart(sixM,"6 mesi")}${miniChart(twoY,"2 anni")}</div>`;
    }

    function openChart(t,e){
      if (e.target.closest("a")) return;
      sessionStorage.setItem("scrollTicker", t);
      location.href = `chart.html?ticker=${encodeURIComponent(t)}`;
    }

    function draw(){
      // Filtra per classe di attivo (azioni / etf / valute / commodity).
      // I dati attuali non hanno un campo "asset_class": vengono trattati tutti come "azioni".
      let base = data.filter(r => (r.asset_class || "azioni") === assetClass);

      // Se è selezionata "La mia lista", mostra solo i ticker in watchlist
      if (sortKey === "watchlist") {
        base = base.filter(r => watchlist.has(r.ticker));
      }

      // Esclude i titoli con trend 6M e SMA discordanti (box gialli/misti).
      base = base.filter(passesTrendFilter);

      let a = [...base].sort((x,y) => {
        // Ordinamento speciale per last_earnings_date: data, poi Market Cap
        if (sortKey === "last_earnings_date") {
          const dx = dateNum(x.last_earnings_date);
          const dy = dateNum(y.last_earnings_date);

          if (dx !== dy) {
            // data più recente prima
            return dx < dy ? 1 : -1;
          }

          const mx = num(x.market_cap);
          const my = num(y.market_cap);

          if (mx !== my) {
            // market cap più alta prima
            return mx < my ? 1 : -1;
          }

          return 0;
        }

        let u = x[sortKey], v = y[sortKey];

        if (["market_cap","change","price"].includes(sortKey)) {
          u = num(u);
          v = num(v);
        } else {
          u = String(u || "").toUpperCase();
          v = String(v || "").toUpperCase();
        }

        return u < v ? -direction : u > v ? direction : 0;
      });

      grid.innerHTML = a.map(r => {
        let ch = String(r.change || "");
        return `<article class="card ${cardClass(r)}" data-ticker="${esc(r.ticker)}" onclick='openChart(${JSON.stringify(r.ticker)},event)'>
          <div class="head">
            <img class="logo" src="${esc(r.logo_url)}" onerror="this.style.display='none'">
            <div>
              <a class="ticker" href="chart.html?ticker=${encodeURIComponent(r.ticker)}" onclick='sessionStorage.setItem("scrollTicker",${JSON.stringify(r.ticker)})'>${esc(r.ticker)}</a>
              <div class="company">${esc(r.company)}</div>
            </div>
            <button class="star ${inWatchlist(r.ticker) ? "active" : ""}" title="Aggiungi/rimuovi da La mia lista" onclick='event.stopPropagation();toggleWatchlist(${JSON.stringify(r.ticker)})'>${inWatchlist(r.ticker) ? "★" : "☆"}</button>
          </div>
          ${previews(r.ticker)}
          <div class="fields">
            <div><span class="label">Prezzo</span><span class="value">${esc(r.price)}</span></div>
            <div><span class="label">Change</span><span class="value ${ch.startsWith("-") ? "negative" : "positive"}">${esc(r.change)}</span></div>
            <div><span class="label">Market Cap</span><span class="value">${esc(r.market_cap)}</span></div>
            <div><span class="label">Volume</span><span class="value">${esc(r.volume)}</span></div>
            <div><span class="label">P/E</span><span class="value">${esc(r.pe)}</span></div>
            <div><span class="label">SMA 20/50/100</span><span class="value">${esc(r.sma_status)}</span></div>
            <div><span class="label">Settore</span><span class="value">${esc(r.sector)}</span></div>
            <div><span class="label">Industria</span><span class="value">${esc(r.industry)}</span></div>
            <div><span class="label">Trend 6M</span><span class="value">${esc(r.trend_6m)}</span></div>
            <div><span class="label">Last earnings date</span><span class="value">${esc(r.last_earnings_date)}</span></div>
            <div><span class="label">Next earnings date</span><span class="value">${esc(r.next_earnings_date)}</span></div>
          </div>
        </article>`;
      }).join("") || '<div class="empty">Nessun dato disponibile</div>';
    }

    function scrollToLastViewed(){
      const wanted = sessionStorage.getItem("scrollTicker");
      if (!wanted) return;
      const el = grid.querySelector(`[data-ticker="${CSS.escape(wanted)}"]`);
      if (el) el.scrollIntoView({block:"center"});
      sessionStorage.removeItem("scrollTicker");
    }

    const assetSelect = document.querySelector("#assetType");
    assetSelect.value = assetClass;
    assetSelect.onchange = e => {
      assetClass = e.target.value;
      localStorage.setItem("assetClass", assetClass);
      draw();
    };

    const sortSelect = document.querySelector("#sort");
    sortSelect.value = sortKey;
    sortSelect.onchange = e => {
      sortKey = e.target.value;
      localStorage.setItem("sortKey", sortKey);
      draw();
    };

    Promise.all([
      fetch("./data.json").then(r => r.json()),
      fetch("./history.json").then(r => r.json())
    ]).then(([p,h]) => {
      data = p.results || [];
      history = h || {};
      let m = p.meta || {};
      meta.textContent = `${data.length} titoli · Aggiornato: ${
        m.updated_at ? new Date(m.updated_at).toLocaleString("it-IT") : "-"
      }`;
      draw();
      scrollToLastViewed();
    }).catch(() => {
      meta.textContent = "Errore nel caricamento";
      grid.innerHTML = '<div class="empty">Impossibile caricare i dati</div>';
    });

    const searchInput = document.querySelector("#search");
    const searchResults = document.querySelector("#searchResults");

    function jumpToCard(ticker, tickerAssetClass){
      searchInput.value = "";
      searchResults.style.display = "none";
      if (tickerAssetClass && tickerAssetClass !== assetClass) {
        assetClass = tickerAssetClass;
        localStorage.setItem("assetClass", assetClass);
        assetSelect.value = assetClass;
      }
      draw();
      const el = grid.querySelector(`[data-ticker="${CSS.escape(ticker)}"]`);
      if (el) {
        el.scrollIntoView({block:"center"});
        el.classList.add("card-highlight");
        setTimeout(() => el.classList.remove("card-highlight"), 1600);
      }
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toUpperCase();
      if (!q) {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
      }
      const pool = data.filter(passesTrendFilter);
      const starts = [], contains = [];
      for (const r of pool) {
        const t = String(r.ticker || "").toUpperCase();
        const c = String(r.company || "").toUpperCase();
        if (t.startsWith(q) || c.startsWith(q)) starts.push(r);
        else if (t.includes(q) || c.includes(q)) contains.push(r);
        if (starts.length + contains.length > 40) break;
      }
      const matches = [...starts, ...contains].slice(0, 8);
      if (!matches.length) {
        searchResults.innerHTML = '<div class="search-item"><span class="c">Nessun risultato</span></div>';
        searchResults.style.display = "block";
        return;
      }
      searchResults.innerHTML = matches.map(r =>
        `<div class="search-item" onclick='jumpToCard(${JSON.stringify(r.ticker)},${JSON.stringify(r.asset_class || "azioni")})'>
          <span class="t">${esc(r.ticker)}</span>
          <span class="c">${esc(r.company)}</span>
        </div>`
      ).join("");
      searchResults.style.display = "block";
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) {
        searchResults.style.display = "none";
      }
    });

    navigator.serviceWorker?.register("./service-worker.js");
  </script>
</body>
</html>
