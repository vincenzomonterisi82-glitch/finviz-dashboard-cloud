<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>Finviz Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #eef2f5;
      color: #17202a;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .topbar {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.35rem;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    #tickerSearch,
    #sortSelect {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #17202a;
      font-size: .9rem;
    }

    #tickerSearch {
      width: 100%;
    }

    #sortSelect {
      width: 180px;
    }

    #status {
      margin: 10px 0 14px;
      color: #64748b;
      font-size: .85rem;
    }

    #error {
      display: none;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      font-size: .9rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    #grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .ticker {
      margin-bottom: 4px;
      color: #075985;
      font-size: 1.15rem;
      font-weight: 750;
    }

    .company {
      min-height: 22px;
      margin-bottom: 12px;
      font-size: .92rem;
      font-weight: 600;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-top: 1px solid #e5e7eb;
      font-size: .85rem;
    }

    .label {
      color: #64748b;
    }

    .value {
      max-width: 60%;
      overflow-wrap: anywhere;
      font-weight: 600;
      text-align: right;
    }

    .positive {
      color: #16803c;
    }

    .negative {
      color: #b42318;
    }

    .empty {
      padding: 18px;
      border-radius: 10px;
      background: #fff;
      color: #64748b;
    }

    @media (max-width: 520px) {
      .controls {
        grid-template-columns: 1fr;
      }

      #sortSelect {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>Finviz Dashboard</h1>

    <div class="controls">
      <input
        id="tickerSearch"
        type="search"
        placeholder="Cerca ticker, es. AAL"
        autocomplete="off"
        aria-label="Cerca ticker"
      >

      <select id="sortSelect" aria-label="Ordina risultati">
        <option value="ticker">Ticker</option>
        <option value="price">Prezzo</option>
        <option value="change">Variazione</option>
        <option value="market_cap">Market Cap</option>
        <option value="last_earnings_date" selected>Last earnings date</option>
      </select>
    </div>

    <div id="status">Caricamento...</div>
    <div id="error"></div>
  </header>

  <main id="grid"></main>

  <script>
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("tickerSearch");
    const sortSelect = document.getElementById("sortSelect");

    sortSelect.value = "last_earnings_date";

    let allItems = [];

    function text(value) {
      if (value === null || value === undefined || value === "") {
        return "-";
      }
      return String(value);
    }

    function showError(message) {
      statusBox.textContent = "Caricamento fallito";
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function numericValue(value) {
      if (value === null || value === undefined) {
        return 0;
      }

      const cleaned = String(value)
        .replace(/,/g, "")
        .replace("%", "")
        .trim();

      const match = cleaned.match(/^(-?d+(?:.d+)?)([KMBT])?$/i);
      if (!match) {
        return 0;
      }

      const number = parseFloat(match[1]);
      const suffix = String(match[2] || "").toUpperCase();

      const multiplier = {
        K: 1e3,
        M: 1e6,
        B: 1e9,
        T: 1e12
      }[suffix] || 1;

      return number * multiplier;
    }

    function dateNum(value) {
      if (!value) {
        return 0;
      }

      const t = Date.parse(value);
      return Number.isNaN(t) ? 0 : t;
    }

    function addLine(label, value, className = "") {
      const row = document.createElement("div");
      row.className = "line";

      const labelElement = document.createElement("span");
      labelElement.className = "label";
      labelElement.textContent = label;

      const valueElement = document.createElement("span");
      valueElement.className = `value ${className}`;
      valueElement.textContent = text(value);

      row.append(labelElement, valueElement);
      return row;
    }

    function createCard(item) {
      const card = document.createElement("article");
      card.className = "card";

      const ticker = document.createElement("div");
      ticker.className = "ticker";
      ticker.textContent = text(item.ticker);

      const company = document.createElement("div");
      company.className = "company";
      company.textContent = text(item.company);

      card.append(ticker, company);

      const change = text(item.change);
      const changeClass = change.startsWith("-") ? "negative" : "positive";

      card.append(
        addLine("Prezzo", item.price),
        addLine("Change", item.change, changeClass),
        addLine("Market Cap", item.market_cap),
        addLine("Volume", item.volume),
        addLine("P/E", item.pe),
        addLine("Settore", item.sector),
        addLine("Industria", item.industry),
        addLine("Paese", item.country),
        addLine("SMA", item.sma_status),
        addLine("Trend 6M", item.trend_6m),
        addLine("Last earnings date", item.last_earnings_date)
      );

      return card;
    }

    function sortedItems(items, field) {
      return [...items].sort((a, b) => {
        if (field === "last_earnings_date") {
          const ad = dateNum(a.last_earnings_date);
          const bd = dateNum(b.last_earnings_date);

          if (ad !== bd) {
            return bd - ad;
          }

          const am = numericValue(a.market_cap);
          const bm = numericValue(b.market_cap);

          if (am !== bm) {
            return bm - am;
          }

          return 0;
        }

        if (field === "ticker") {
          return String(a.ticker || "").localeCompare(
            String(b.ticker || ""),
            "it",
            { sensitivity: "base" }
          );
        }

        return numericValue(b[field]) - numericValue(a[field]);
      });
    }

    function filteredItems(items) {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        return items;
      }

      return items.filter(item => {
        const ticker = String(item.ticker || "").toLowerCase();
        return ticker.includes(query);
      });
    }

    function render(items) {
      if (!Array.isArray(items)) {
        throw new Error("Il campo results non è un array.");
      }

      grid.replaceChildren();

      if (items.length === 0) {
        statusBox.textContent = "Nessun ticker trovato";

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nessun risultato per questa ricerca.";

        grid.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        fragment.appendChild(createCard(item));
      });

      grid.appendChild(fragment);

      const query = searchInput.value.trim();

      if (query) {
        statusBox.textContent = `${items.length} risultati per "${query}"`;
      } else {
        statusBox.textContent = `${items.length} titoli caricati`;
      }
    }

    function refresh() {
      try {
        const filtered = filteredItems(allItems);
        const ordered = sortedItems(filtered, sortSelect.value);
        render(ordered);
      } catch (error) {
        console.error(error);
        showError(`Errore durante la visualizzazione: ${error.message}`);
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`data.json non raggiungibile: HTTP ${response.status}`);
        }

        const json = await response.json();

        if (!json || !Array.isArray(json.results)) {
          throw new Error("Struttura JSON non valida: manca results.");
        }

        allItems = json.results;
        refresh();

      } catch (error) {
        console.error(error);
        showError(
          `${error.message}

` +
          "Controlla che data.json sia nella stessa cartella di dashboard.html e che il JSON sia valido."
        );
      }
    }

    searchInput.addEventListener("input", refresh);
    sortSelect.addEventListener("change", refresh);

    loadDashboard();
  </script>
</body>
</html>
