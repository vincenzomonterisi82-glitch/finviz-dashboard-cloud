<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#01696f'><link rel='manifest' href='./manifest.json'><title>Finviz Dashboard</title><style>body{font-family:system-ui;margin:0;padding:16px;background:#f5f5f5}h1{font-size:1.5rem}.meta{color:#666;font-size:.9rem;margin:12px 0}.table{overflow:auto;background:#fff}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}th{background:#eee;cursor:pointer;position:sticky;top:0}a{color:#075985;text-decoration:underline}.pos{color:#287a32}.neg{color:#b02835}</style></head><body><h1>Finviz Dashboard</h1><div id='meta' class='meta'>Caricamento...</div><div class='table'><table><thead><tr><th data-k='ticker'>Ticker</th><th data-k='company'>Company</th><th data-k='sector'>Sector</th><th data-k='market_cap'>Market Cap</th><th data-k='change'>Change</th><th data-k='trend_6m'>TREND 6M</th><th data-k='sma_status'>SMA</th></tr></thead><tbody id='body'></tbody></table></div><script>let data=[],sort={k:'market_cap',d:-1};const body=document.querySelector('#body'),meta=document.querySelector('#meta');const num=v=>{let m=String(v||'').replace('%','').match(/(-?[\d.]+)([BMK])?/i);return m?parseFloat(m[1])*({B:1e9,M:1e6,K:1e3}[String(m[2]||'').toUpperCase()]||1):0};const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function draw(){let a=[...data].sort((x,y)=>{let u=x[sort.k],v=y[sort.k];if(['market_cap','change'].includes(sort.k)){u=num(u);v=num(v)}else{u=String(u||'').toUpperCase();v=String(v||'').toUpperCase()}return u<v?-sort.d:u>v?sort.d:0});body.innerHTML=a.map(r=>`<tr><td><a href='chart.html?ticker=${encodeURIComponent(r.ticker)}'>${esc(r.ticker)}</a></td><td>${esc(r.company)}</td><td>${esc(r.sector)}</td><td>${esc(r.market_cap)}</td><td class='${String(r.change).startsWith('-')?'neg':'pos'}'>${esc(r.change)}</td><td>${esc(r.trend_6m)}</td><td>${esc(r.sma_status)}</td></tr>`).join('')||'<tr><td colspan=7>Nessun dato</td></tr>'}fetch('./data.json').then(r=>r.json()).then(p=>{data=p.results||[];let m=p.meta||{};meta.textContent=`Stato: ${m.status||'-'} · Titoli: ${data.length} · Aggiornato: ${m.updated_at?new Date(m.updated_at).toLocaleString('it-IT'):'-'}`;draw()});document.querySelectorAll('th').forEach(t=>t.onclick=()=>{sort.k===t.dataset.k?sort.d*=-1:(sort.k=t.dataset.k,sort.d=1);draw()});navigator.serviceWorker?.register('./service-worker.js')</script></body></html>
