<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>Finviz Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #eef2f5;
      color: #17202a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    #status {
      margin-bottom: 14px;
      color: #64748b;
      font-size: .9rem;
    }

    #error {
      display: none;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      white-space: pre-wrap;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 300px), 1fr)
      );
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .ticker {
      margin-bottom: 4px;
      color: #075985;
      font-size: 1.15rem;
      font-weight: 750;
    }

    .company {
      margin-bottom: 12px;
      font-size: .92rem;
      font-weight: 600;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-top: 1px solid #e5e7eb;
      font-size: .85rem;
    }

    .label {
      color: #64748b;
    }

    .value {
      font-weight: 600;
      text-align: right;
    }

    .positive {
      color: #16803c;
    }

    .negative {
      color: #b42318;
    }
  </style>
</head>

<body>
  <h1>Finviz Dashboard</h1>

  <div id="status">Caricamento...</div>
  <div id="error"></div>
  <main id="grid"></main>

  <script>
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const grid = document.getElementById("grid");

    function showError(message) {
      statusBox.textContent = "Caricamento fallito";
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function text(value) {
      return value === null || value === undefined || value === ""
        ? "-"
        : String(value);
    }

    function addLine(label, value, className = "") {
      return `
        <div class="line">
          <span class="label">${label}</span>
          <span class="value ${className}">${text(value)}</span>
        </div>
      `;
    }

    function render(items) {
      if (!Array.isArray(items)) {
        throw new Error("Il campo results non è un array.");
      }

      if (items.length === 0) {
        statusBox.textContent = "Nessun titolo trovato";
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const change = text(item.change);
        const changeClass = change.startsWith("-")
          ? "negative"
          : "positive";

        card.innerHTML = `
          <div class="ticker">${text(item.ticker)}</div>
          <div class="company">${text(item.company)}</div>
          ${addLine("Prezzo", item.price)}
          ${addLine("Change", item.change, changeClass)}
          ${addLine("Market Cap", item.market_cap)}
          ${addLine("Volume", item.volume)}
          ${addLine("P/E", item.pe)}
          ${addLine("Settore", item.sector)}
          ${addLine("Industria", item.industry)}
          ${addLine("Paese", item.country)}
          ${addLine("SMA", item.sma_status)}
          ${addLine("Trend 6M", item.trend_6m)}
        `;

        fragment.appendChild(card);
      });

      grid.replaceChildren(fragment);
      statusBox.textContent = `${items.length} titoli caricati`;
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `data.json non raggiungibile: HTTP ${response.status}`
          );
        }

        const json = await response.json();
        render(json.results);

      } catch (error) {
        console.error(error);
        showError(
          `${error.message}

Controlla che data.json sia nella stessa cartella di dashboard.html.`
        );
      }
    }

    loadDashboard();
  </script>
</body>
</html>
