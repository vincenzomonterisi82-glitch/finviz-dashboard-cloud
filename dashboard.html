<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#01696f'><link rel='manifest' href='./manifest.json'><title>Finviz Dashboard</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:14px;background:#eef2f5;color:#17202a}h1{font-size:1.35rem;margin:4px 0 10px}.top{position:sticky;top:0;z-index:2;background:#eef2f5;padding-bottom:10px}.controls{display:flex;gap:8px;align-items:center}.controls select{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-size:.95rem}.meta{color:#64748b;font-size:.78rem;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}.card{border-radius:14px;padding:14px;box-shadow:0 2px 8px #17202a18}.bull{background:#e8f5e9}.bear{background:#ffebee}.mixed{background:#fff8d6}.head{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid #ffffff99;padding-bottom:10px;margin-bottom:10px}.ticker{font-size:1.2rem;font-weight:750;color:#075985;text-decoration:none}.company{font-size:.92rem;margin-top:3px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{min-width:0}.label{display:block;color:#64748b;font-size:.72rem}.value{display:block;font-size:.9rem;font-weight:600;overflow-wrap:anywhere}.positive{color:#16803c}.negative{color:#b42318}.empty{padding:20px;background:#fff;border-radius:12px;color:#64748b}</style></head><body><div class='top'><h1>Finviz Dashboard</h1><div class='controls'><select id='sort'><option value='market_cap'>Ordina: Market Cap</option><option value='change'>Ordina: Change</option><option value='ticker'>Ordina: Ticker</option><option value='trend_6m'>Ordina: Trend 6M</option><option value='price'>Ordina: Prezzo</option></select></div><div id='meta' class='meta'>Caricamento...</div></div><main id='grid' class='grid'></main><script>let data=[],sortKey='market_cap',direction=-1;const grid=document.querySelector('#grid'),meta=document.querySelector('#meta');const num=v=>{let m=String(v||'').replace('%','').match(/(-?[\d.]+)([BMKT])?/i);return m?parseFloat(m[1])*({T:1e12,B:1e9,M:1e6,K:1e3}[String(m[2]||'').toUpperCase()]||1):0};const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function cardClass(r){let high=String(r.trend_6m).toUpperCase()==='HIGH',low=String(r.trend_6m).toUpperCase()==='LOW',above=String(r.sma_status).toUpperCase().startsWith('SOPRA'),below=String(r.sma_status).toUpperCase().startsWith('SOTTO');return high&&above?'bull':low&&below?'bear':'mixed'}function draw(){let a=[...data].sort((x,y)=>{let u=x[sortKey],v=y[sortKey];if(['market_cap','change','price'].includes(sortKey)){u=num(u);v=num(v)}else{u=String(u||'').toUpperCase();v=String(v||'').toUpperCase()}return u<v?-direction:u>v?direction:0});grid.innerHTML=a.map(r=>{let ch=String(r.change||'');return `<article class='card ${cardClass(r)}'><div class='head'><div><a class='ticker' href='chart.html?ticker=${encodeURIComponent(r.ticker)}'>${esc(r.ticker)}</a><div class='company'>${esc(r.company)}</div></div></div><div class='fields'><div class='field'><span class='label'>Prezzo</span><span class='value'>${esc(r.price)}</span></div><div class='field'><span class='label'>Change</span><span class='value ${ch.startsWith('-')?'negative':'positive'}'>${esc(r.change)}</span></div><div class='field'><span class='label'>Market Cap</span><span class='value'>${esc(r.market_cap)}</span></div><div class='field'><span class='label'>Volume</span><span class='value'>${esc(r.volume)}</span></div><div class='field'><span class='label'>P/E</span><span class='value'>${esc(r.pe)}</span></div><div class='field'><span class='label'>SMA 20/50/100</span><span class='value'>${esc(r.sma_status)}</span></div><div class='field'><span class='label'>Settore</span><span class='value'>${esc(r.sector)}</span></div><div class='field'><span class='label'>Industria</span><span class='value'>${esc(r.industry)}</span></div><div class='field'><span class='label'>Trend 6M</span><span class='value'>${esc(r.trend_6m)}</span></div><div class='field'><span class='label'>Last earnings date</span><span class='value'>${esc(r.last_earnings_date)}</span></div><div class='field'><span class='label'>Next earnings date</span><span class='value'>${esc(r.next_earnings_date)}</span></div></div></article>`}).join('')||'<div class="empty">Nessun dato disponibile</div>'}document.querySelector('#sort').onchange=e=>{sortKey=e.target.value;draw()};fetch('./data.json').then(r=>r.json()).then(p=>{data=p.results||[];let m=p.meta||{};meta.textContent=`${data.length} titoli · Aggiornato: ${m.updated_at?new Date(m.updated_at).toLocaleString('it-IT'):'-'}`;draw()}).catch(()=>{meta.textContent='Errore nel caricamento';grid.innerHTML='<div class="empty">Impossibile caricare i dati</div>'});navigator.serviceWorker?.register('./service-worker.js')</script></body></html>
