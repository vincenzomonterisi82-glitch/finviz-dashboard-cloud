<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#01696f'><script src='https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js'></script><title>Grafico Finviz</title><style>body{font-family:system-ui;margin:0;padding:16px;background:#f5f5f5}a{color:#075985}.toolbar{display:flex;gap:8px;align-items:center}.toolbar select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.box{background:#fff;padding:8px;border-radius:10px}#chart{width:100%;height:70vh}</style></head><body><p><a href='dashboard.html'>← Dashboard</a></p><h1 id='title'>Grafico</h1><div class='toolbar'><label for='period'>Storico:</label><select id='period'><option value='6'>6 mesi</option><option value='24'>2 anni</option></select></div><div class='box'><div id='chart'></div></div><script>const ticker=new URLSearchParams(location.search).get('ticker');document.querySelector('#title').textContent=`${ticker||''} · Daily`;const root=document.querySelector('#chart');const chart=LightweightCharts.createChart(root,{layout:{background:{color:'#fff'},textColor:'#374151'},grid:{vertLines:{color:'#e5e7eb'},horzLines:{color:'#e5e7eb'}},rightPriceScale:{borderColor:'#d1d5db'},timeScale:{borderColor:'#d1d5db',timeVisible:false}});const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#16a34a',downColor:'#dc2626',borderUpColor:'#16a34a',borderDownColor:'#dc2626',wickUpColor:'#16a34a',wickDownColor:'#dc2626'});const line=(color)=>chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:2,crosshairMarkerVisible:false});let all=[];function render(){let n=document.querySelector('#period').value==='6'?126:all.length;let rows=all.slice(-n);candles.setData(rows.map(x=>({time:x.date,open:x.open,high:x.high,low:x.low,close:x.close})));let s20=line('#2563eb'),s50=line('#f59e0b'),s100=line('#dc2626');s20.setData(rows.filter(x=>x.sma20!=null).map(x=>({time:x.date,value:x.sma20})));s50.setData(rows.filter(x=>x.sma50!=null).map(x=>({time:x.date,value:x.sma50})));s100.setData(rows.filter(x=>x.sma100!=null).map(x=>({time:x.date,value:x.sma100})));chart.timeScale().fitContent()}fetch('./history.json').then(r=>r.json()).then(x=>{all=x[ticker]||[];render()});document.querySelector('#period').onchange=render;new ResizeObserver(()=>chart.applyOptions({width:root.clientWidth,height:root.clientHeight})).observe(root)</script></body></html>
