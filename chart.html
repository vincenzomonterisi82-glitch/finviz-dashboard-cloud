<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#01696f'><script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js'></script><title>Grafico Finviz</title><style>body{font-family:system-ui;margin:0;padding:16px;background:#f5f5f5}a{color:#075985}.box{background:#fff;padding:10px;border-radius:10px}canvas{width:100%!important;height:65vh!important}</style></head><body><p><a href='dashboard.html'>← Dashboard</a></p><h1 id='title'>Grafico</h1><div class='box'><canvas id='chart'></canvas></div><script>const ticker=new URLSearchParams(location.search).get('ticker');document.querySelector('#title').textContent=`${ticker||''} · Daily 6 mesi`;fetch('./history.json').then(r=>r.json()).then(all=>{let rows=all[ticker]||[];let labels=rows.map(x=>x.date);new Chart(document.querySelector('#chart'),{type:'line',data:{labels,datasets:[{label:'Prezzo',data:rows.map(x=>x.close),borderColor:'#111827',pointRadius:0,borderWidth:2},{label:'SMA20',data:rows.map(x=>x.sma20),borderColor:'#2563eb',pointRadius:0,borderWidth:1.5},{label:'SMA50',data:rows.map(x=>x.sma50),borderColor:'#f59e0b',pointRadius:0,borderWidth:1.5},{label:'SMA100',data:rows.map(x=>x.sma100),borderColor:'#dc2626',pointRadius:0,borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:false}}}})})</script></body></html>
